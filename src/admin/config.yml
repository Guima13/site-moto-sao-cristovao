# Painel de gestão do site Moto S. Cristóvão (Decap CMS)
# Cada alteração publicada atualiza o site automaticamente em ~1 minuto.

backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: "Adicionar {{collection}}: {{slug}}"
    update: "Atualizar {{collection}}: {{slug}}"
    delete: "Apagar {{collection}}: {{slug}}"
    uploadMedia: "Carregar foto {{path}}"
    deleteMedia: "Apagar foto {{path}}"

locale: pt
site_url: https://www.motosaocristovao.pt
display_url: https://www.motosaocristovao.pt

# As fotos carregadas no painel ficam aqui (o site otimiza-as automaticamente ao publicar)
media_folder: src/assets/fotos/uploads
public_folder: /assets/fotos/uploads

collections:
  # ---------------- MOTAS NOVAS ----------------
  - name: motas
    label: Motas novas
    label_singular: Mota nova
    description: "Motas novas à venda ou por encomenda. A primeira foto é a foto principal."
    folder: content/motas
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{marca}}-{{modelo}}"
    identifier_field: modelo
    summary: "{{marca}} {{modelo}} · {{disponibilidade}}"
    sortable_fields: ["marca", "modelo", "segmento"]
    view_groups:
      - { label: Marca, field: marca }
      - { label: Disponibilidade, field: disponibilidade }
    editor: { preview: false }
    fields:
      - { label: Publicado no site, name: publicado, widget: boolean, default: true, hint: "Desligue para esconder a mota sem a apagar." }
      - { label: Marca, name: marca, widget: select, options: [Benelli, Keeway, Kymco, Linhai] }
      - { label: Modelo, name: modelo, widget: string, hint: "Ex.: TRK 502 X" }
      - label: Segmento
        name: segmento
        widget: select
        options: ["Trail / Aventura", "Desportivas", "Naked", "Custom e clássicas", "Maxi-scooters", "Scooters", "Moto 4 / UTV"]
      - label: Disponibilidade
        name: disponibilidade
        widget: select
        options: ["Em stand", "Por encomenda"]
        default: "Por encomenda"
      - { label: Destaque na página inicial, name: destaque, widget: boolean, default: false, hint: "Aparecem as 4 primeiras marcadas." }
      - label: Fotos
        name: fotos
        widget: list
        hint: "Carregue as fotos tiradas no stand (pode ser diretamente do telemóvel). Arraste para mudar a ordem — a primeira é a principal."
        field: { label: Foto, name: foto, widget: image, choose_url: false }
      - { label: Descrição curta, name: descricao, widget: text, required: false }
      - { label: Preço (€), name: preco, widget: number, value_type: int, required: false, hint: "Deixe vazio para mostrar «Preço sob consulta»." }
      - { label: Transporte e legalização (€), name: transporte_legalizacao, widget: number, value_type: int, required: false }
      - { label: Cilindrada (cc), name: cilindrada, widget: number, value_type: int, required: false }
      - label: Carta de condução
        name: carta
        widget: select
        options:
          - { label: "AM / B (50 cc)", value: AM }
          - { label: "A1 / B (até 125 cc)", value: A1 }
          - { label: "A2", value: A2 }
          - { label: "A", value: A }
          - { label: "Consultar", value: Consultar }
        default: A1
      - { label: Potência (kW), name: potencia_kw, widget: number, value_type: float, required: false }
      - { label: Potência (cv), name: potencia_cv, widget: number, value_type: float, required: false }
      - { label: Peso (kg), name: peso, widget: number, value_type: int, required: false }
      - { label: Depósito (L), name: deposito, widget: number, value_type: float, required: false }
      - { label: Altura do banco (mm), name: altura_banco, widget: number, value_type: int, required: false }
      - { label: Link para o site oficial da marca, name: link_oficial, widget: string, required: false }

  # ---------------- MOTAS USADAS ----------------
  - name: usadas
    label: Motas usadas
    label_singular: Mota usada
    description: "Usadas à venda. Marque «Vendida» para a retirar do site sem a apagar."
    folder: content/usadas
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{modelo}}-{{ano}}"
    identifier_field: modelo
    summary: "{{modelo}} ({{ano}})"
    editor: { preview: false }
    fields:
      - { label: Publicado no site, name: publicado, widget: boolean, default: true }
      - { label: Vendida, name: vendida, widget: boolean, default: false, hint: "Ao marcar, deixa de aparecer no site." }
      - { label: Marca e modelo, name: modelo, widget: string, hint: "Ex.: Honda NC750X" }
      - { label: Tipo, name: tipo, widget: select, options: [Scooter, Naked, Trail, Touring, Custom, Desportiva, Motocross, Crossover, "Moto 4"], required: false }
      - { label: Ano, name: ano, widget: number, value_type: int, required: false }
      - { label: Quilómetros, name: quilometros, widget: number, value_type: int, required: false }
      - { label: Preço (€), name: preco, widget: number, value_type: int, required: false, hint: "Deixe vazio para mostrar «Preço sob consulta»." }
      - label: Fotos
        name: fotos
        widget: list
        hint: "Clique em «Adicionar fotos» uma vez por cada foto. Arraste para mudar a ordem — a primeira é a principal."
        field: { label: Foto, name: foto, widget: image, choose_url: false }
      - { label: Descrição, name: descricao, widget: text, required: false, hint: "Ex.: revisão feita, pneus novos, um só dono…" }

  # ---------------- INFORMAÇÕES DO STAND ----------------
  - name: definicoes
    label: Informações do stand
    editor: { preview: false }
    files:
      - name: site
        label: Contactos, horário e redes sociais
        file: content/site.json
        fields:
          - { label: Telefone, name: telefone, widget: string }
          - { label: Email, name: email, widget: string }
          - { label: Morada, name: morada, widget: string }
          - { label: Código postal e localidade, name: codigo_postal, widget: string }
          - { label: Horário (versão curta, topo do site), name: horario_curto, widget: string }
          - label: Horário (linhas da página de contactos)
            name: horario
            widget: list
            field: { label: Linha, name: linha, widget: string }
          - { label: WhatsApp (telemóvel), name: whatsapp, widget: string, required: false, hint: "Só números, ex.: 912345678. Vazio = sem botão de WhatsApp." }
          - { label: Facebook (link), name: facebook, widget: string, required: false }
          - { label: Instagram (link), name: instagram, widget: string, required: false }
